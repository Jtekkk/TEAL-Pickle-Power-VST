name: Build

on:
  push:
    branches: [ main, master, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publish a GitHub Release from this run"
        type: boolean
        default: false
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        type: string
        default: "v1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Windows, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxcursor-dev libxcomposite-dev libfreetype6-dev libfontconfig1-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPP_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test (DSP smoke test + state round-trip)
        run: ctest --test-dir build -C Release --output-on-failure

      # ---- pluginval: industry-standard host-behaviour validation ----
      - name: Install pluginval
        shell: bash
        run: |
          set -e
          base="https://github.com/Tracktion/pluginval/releases/latest/download"
          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -fL --retry 3 -o pluginval.zip "$base/pluginval_Linux.zip"
            unzip -o pluginval.zip
            chmod +x pluginval
            echo "PLUGINVAL=./pluginval" >> "$GITHUB_ENV"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            curl -fL --retry 3 -o pluginval.zip "$base/pluginval_macOS.zip"
            unzip -o pluginval.zip
            echo "PLUGINVAL=pluginval.app/Contents/MacOS/pluginval" >> "$GITHUB_ENV"
          else
            curl -fL --retry 3 -o pluginval.zip "$base/pluginval_Windows.zip"
            7z x pluginval.zip
            echo "PLUGINVAL=./pluginval.exe" >> "$GITHUB_ENV"
          fi

      - name: Validate (pluginval, strictness 10)
        shell: bash
        run: |
          set -e
          vst3="build/PicklePower_artefacts/Release/VST3/Pickle Power.vst3"
          args="--strictness-level 10 --repeat 3 --randomise --timeout-ms 600000 --validate"
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "$PLUGINVAL" $args "$vst3"
          else
            "$PLUGINVAL" $args "$vst3"
          fi

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicklePower-${{ runner.os }}
          path: build/PicklePower_artefacts/Release/**
          if-no-files-found: error

      # ---- packaging (zip/tar always; native installers best-effort) ----
      - name: Package (zip / tar)
        shell: bash
        run: |
          cd build/PicklePower_artefacts/Release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../../../PicklePower-${{ runner.os }}.zip" ./*
          else
            tar -czf "../../../PicklePower-${{ runner.os }}.tar.gz" ./*
          fi

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: PicklePower-${{ runner.os }}-package
          path: |
            PicklePower-${{ runner.os }}.zip
            PicklePower-${{ runner.os }}.tar.gz
          if-no-files-found: ignore

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\PicklePower.iss

      - name: Build macOS installer (.pkg)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: bash packaging/macos/build_pkg.sh

      - name: Upload native installer
        if: runner.os != 'Linux'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: PicklePower-${{ runner.os }}-installer
          path: |
            packaging/windows/Output/*.exe
            *.pkg
          if-no-files-found: ignore

  # ---- publish a GitHub Release when a v* tag is pushed ----
  release:
    name: Release
    needs: build
    # Publish on a v* tag push, a manual dispatch with make_release, or a push
    # whose commit message contains [publish-release] (the env here can't push
    # tags, so the commit-message marker is the usable trigger).
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.make_release == 'true') ||
      contains(github.event.head_commit.message, '[publish-release]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: ver
        shell: bash
        run: |
          v="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' Source/Utils/Constants.h | head -1)"
          dispatch_tag="${{ github.event.inputs.tag }}"
          if [ -n "$dispatch_tag" ]; then tag="$dispatch_tag";
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then tag="${{ github.ref_name }}";
          else tag="v$v"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          # Only the named installers / packages (all start with "PicklePower"),
          # not the bare standalone "Pickle Power.exe" build output.
          find artifacts -type f -name 'PicklePower*' \
            \( -name '*.exe' -o -name '*.pkg' -o -name '*.zip' -o -name '*.tar.gz' \) \
            -exec cp {} release/ \;
          echo "Release files:"; ls -la release

      - name: Remove any previous release for this tag (clean re-publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.ver.outputs.tag }}" --cleanup-tag --yes || true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pickle Power ${{ steps.ver.outputs.tag }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
